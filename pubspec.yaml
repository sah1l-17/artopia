name: artgallery_new
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.6
  firebase_core: ^2.24.0
  firebase_auth: ^4.12.0
  firebase_storage: ^11.6.5
  cloud_firestore: ^4.15.0
  shared_preferences: ^2.2.2
  js: ^0.6.7  
  flutter_blurhash: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.3.1
  intl: ^0.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
    - assets/facebook_logo.png
    - assets/apple_logo.png
    - assets/img1.jpeg
    - assets/img2.jpeg
    - assets/img3.jpeg
    - assets/img4.jpeg
    - assets/pic2.jpeg
    - assets/vintage_landscape.webp
    - assets/Flower_pottery.jpg
    - assets/Christopher_Beahan.jpeg
    - assets/gpay.png
    - assets/paypal.png
    - assets/upi.png

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/icons/splash_logo.png"

fonts:
  - family: Roboto
    fonts:
      - asset: assets/fonts/Roboto-Regular.ttf